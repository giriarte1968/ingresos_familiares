alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
envs:
- key: STREAMLIT_THEME_BASE
  scope: RUN_TIME
  value: dark
- key: GIT_WRITE_TOKEN
  scope: RUN_TIME
  value: ""
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: valu
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: valu
region: nyc
services:
- environment_slug: python
  github:
    branch: main
    deploy_on_push: true
    repo: giriarte1968/ingresos_familiares
  http_port: 8080
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: valu
  run_command: |
    python -m playwright install chromium --with-deps 2>&1 || true
    streamlit run valu.py --server.address 0.0.0.0 --server.port $PORT
  source_dir: /
